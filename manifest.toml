schema-version = 1

[package]
title = "StudioX"
version = "0.1.0"
id = "com.studiox.app"

[os.version]
min = "1.2"
target = "1.2"

[components]
[[components.interactive]]
id = "com.studiox.app.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
# kepler.media: required for Vega Media Controls (remote + Alexa transport).
categories = ["com.amazon.category.main", "com.amazon.category.kepler.media"]

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.svg_3@ISVG_0"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.reanimated_4@IReanimated_0"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"

[[needs.module]]
id = "/com.amazon.kepler.worklets_1@IWorklets_0"

# System toasts (useToastKepler): "Sent to <phone>" after Send to phone.
[[needs.privilege]]
id = "com.amazon.notification.privilege.post"

# W3C media playback (URL mode, clear content). Taken from the RN 0.83
# vega-video-sample; DRM, IAP and catalog services are deliberately omitted.
[wants]
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.audio.system"

[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*"

# Vega Media Controls: the W3C player publishes playback state and receives
# play/pause/seek. Missing command_options silently drop commands.
[[extras]]
key = "interface.provider"
component-id = "com.studiox.app.main"

[extras.value.application]
[[extras.value.application.interface]]
interface_name = "com.amazon.kepler.media.IMediaPlaybackServer"
command_options = ["StartOver", "SkipForward", "SkipBackward"]
features = ["AdvancedSeek"]

# Development only: the companion server runs over plain HTTP on the LAN
# (src/config.ts). Remove this section once the companion is served over HTTPS.
[network-traffic-policy.cleartext]
allowed-domains = ["10.49.6.101", "192.168.122.1", "localhost"]
