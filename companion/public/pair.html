<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>StudioX pair</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/pair.js" defer></script>
</head>
<body>
  <header class="bar"><div class="mark">STUDIO<span>X</span></div></header>
  <main>
    <p class="tag">LINK // CODE</p>
    <h1>Type the code on your TV.</h1>
    <form id="form" autocomplete="off">
      <input id="code" class="code" inputmode="text" autocapitalize="characters"
             maxlength="7" placeholder="XXX-XXX" aria-label="Pairing code">
      <button class="act" type="submit">LINK</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
