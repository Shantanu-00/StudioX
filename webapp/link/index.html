<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="StudioX Link — Private second-screen phone companion for Fire TV">
  <title>StudioX Link</title>

  <link rel="manifest" href="/link/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/link/icons/icon.svg">
  <link rel="apple-touch-icon" href="/link/icons/icon-192.png">
  <link rel="stylesheet" href="/link/style.css">
</head>
<body>
  <div id="app" role="application" aria-label="StudioX Link Companion"></div>

  <script type="module" src="/link/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/link/sw.js').catch((err) => {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
